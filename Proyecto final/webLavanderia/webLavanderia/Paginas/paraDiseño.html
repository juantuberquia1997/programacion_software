<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de Sesión</title>
    <!-- Scripts Base Sup -->
    <!-- Google Api Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Para bootstrap base: adminlte -->
    <link href="../Estilos/adminlte.min.css" rel="stylesheet" />

    <!-- Para images botones -->
    <link href="../Estilos/css/all.min.css" rel="stylesheet" />

    <!-- Para sweetAlert -->
    <link href="../Scripts_Form/Comunes/bootstrap.min.css" rel="stylesheet" />
    <link href="../Scripts_Form/Comunes/sweetalert2.min.css" rel="stylesheet" />

    <style>
        .auto-style1 {
            width: 100%;
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="card card-primary">
            <div class="card-header text-center">
                <h3 class="card-title w-100">Inicio de Sesión</h3>
            </div>
            <form id="frmLogueo">
                <div class="card-body">
                    <table align="center" cellpadding="3" class="auto-style1">
                        <tr>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                        </tr>
                        <tr>
                            <td>Usuario:</td>
                            <td colspan="4"><input id="txtUsuario" type="text" class="form-control" placeholder="Ingrese Usuario..." autocomplete="username" /></td>
                        </tr>
                        <tr>
                            <td>Clave:</td>
                            <td colspan="4"><input id="txtClave" type="password" class="form-control" placeholder="Ingrese Clave..." autocomplete="current-password" /></td>
                        </tr>
                        <tr>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                            <td>&nbsp;</td>
                        </tr>
                        <tr>
                            <td colspan="2"><input id="btnLimpiar" type="button" value="Limpiar" class="btn btn-secondary btn-block" /></td>
                            <td>&nbsp;</td>
                            <td colspan="2"><input id="btnIngresar" type="button" value="Ingresar" class="btn btn-primary btn-block" /></td>
                        </tr>
                    </table>
                </div>
            </form>
        </div>
    </div>

    <!-- Para los script de uso base (Conservar el orden) -->
    <script src="../Scripts/jquery-3.7.0.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/bootstrap.min.js"></script>

    <!-- Para sweetAlert -->
    <script src="../Scripts_Form/Comunes/sweetalert2.all.min.js"></script>

    <!-- Para el script de control del form -->
    <script src="../Scripts_Form/frmLogueo.js"></script>
</body>
</html>
