<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresos </title>
    <!-- Scripts Base Sup -->
    <!-- Google Api Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Para bootstrap base: adminlte -->
    <link href="../Estilos/adminlte.min.css" rel="stylesheet" />

    <!--Para images botones-->
    <link href="../Estilos/css/all.min.css" rel="stylesheet" />   <!--Para images botones-->
    <!--Para sweetAlert-->
    <link href="../Scripts_Form/Comunes/bootstrap.min.css" rel="stylesheet" />
    <link href="../Scripts_Form/Comunes/sweetalert2.min.css" rel="stylesheet" />


    <!-- Estilos para los Select (combos) -->
    <link href="../Estilos/select2.min.css" rel="stylesheet" />
    <link href="../Estilos/select2-bootstrap4.min.css" rel="stylesheet" />
    <!-- Estilos para las tablas(datatables) -->
    <link href="../Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
    <link href="../Estilos/dataTables.min.css" rel="stylesheet" />

</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <!-- left column -->
                <div class="col-md-12" id="dvMenu">
                    <!-- Para incrustar la página que contiene el ménu de navegación-->
                </div>
                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">Maestro de Ingreso</h3>
                        </div>
                        <form id="frmDatosIn">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">Datos de Entrada</h3>
                                    </div>

                                    <div class="card-body">
                                        <!-- 1er. row -->
                                        <div class="row">
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <label for="txtCodigo">Código:</label>
                                                    <input type="text" class="form-control label_1" id="txtCodigo" disabled>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cboCliente">Cliente:</label>
                                                    <select id="cboCliente" class="form-control select2" style="width: 100%;">
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cboEmpleado">Empleado:</label>
                                                    <select id="cboEmpleado" class="form-control select2" style="width: 100%;">
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <label for="txtFechaIngreso">Fecha de Ingreso:</label>
                                                    <input type="date" class="form-control" id="txtFechaIngreso" disabled>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- 2do. row -->
                                        <div class="row">
                                            <div class="col-md-1">
                                                <div class="form-group">
                                                    <label for="chkDomicilio">Domicilio:</label>
                                                    <input type="checkbox" class="form-control" id="chkDomicilio">
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label for="cboDireccionCliente">Dirección Cliente:</label>
                                                    <select id="cboDireccionCliente" class="form-control select2" style="width: 100%;">
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="txtValorTotal">Valor Total Ingreso:</label>
                                                    <input type="text" class="form-control label_1" id="txtValorTotal" disabled placeholder="0.00">
                                                </div>
                                            </div>
                                            <div class="col-md-1">
                                                <div class="form-group">
                                                    <label for="chkActivo">Activo:</label>
                                                    <input type="checkbox" class="form-control" id="chkActivo">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- 3er. row (detalle_ingreso) -->
                                        <div class="row">
                                            <div class="col-md-12">
                                                <table id="tablaCapturaDetalle" class="table table-bordered table-striped">
                                                    <thead>
                                                        <tr>
                                                            <td style="width: 30%;">
                                                                <div class="form-group">
                                                                    <label for="cboTipoPrendaServicio">Tipo Prenda / Servicio:</label>
                                                                    <select id="cboTipoPrendaServicio" class="form-control select2" style="width: 100%;">
                                                                    </select>
                                                                </div>
                                                            </td>
                                                            <td style="width: 20%;">
                                                                <div class="form-group">
                                                                    <label for="cboEstadoPrenda">Estado Prenda:</label>
                                                                    <select id="cboEstadoPrenda" class="form-control">
                                                                    </select>
                                                                </div>
                                                            </td>
                                                            <td style="width: 12%;">
                                                                <div class="form-group">
                                                                    <label for="txtCantidad">Cantidad:</label>
                                                                    <input type="number" min="1" class="form-control" id="txtCantidad" value="1">
                                                                </div>
                                                            </td>
                                                            <td style="width: 20%;">
                                                                <div class="form-group">
                                                                    <label for="txtDescuento">Descuento:</label>
                                                                    <input type="number" class="form-control" id="txtDescuento" disabled>
                                                                </div>
                                                            </td>
                                                            <td style="width: 18%;">
                                                                <div class="form-group">
                                                                    <label for="txtValorLinea">Valor:</label>
                                                                    <input type="number" step="0.01" class="form-control" id="txtValorLinea" disabled placeholder="0.00">
                                                                </div>
                                                            </td>
                                                        </tr>
                                        <tr>
                                            <td colspan="5">
                                                <div class="form-group mb-0">
                                                    <label for="txtObservacion">Observación:</label>
                                                    <input type="text" class="form-control" id="txtObservacion" placeholder="Manchas, botones, cuidados especiales...">
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="5">
                                                <button type="button" id="btnAgregarLinea" class="btn btn-success btn-block">
                                                    <i class="fas fa-plus mr-1"></i> Agregar línea al detalle
                                                </button>
                                            </td>
                                        </tr>
                                                    </thead>
                                                </table>
                                            </div>
                                        </div>

                                        <!-- Tabla de ítems del detalle -->
                                        <div class="row mt-3">
                                            <div class="col-md-12">
                                                <h5>Detalle del Ingreso</h5>
                                                <table id="tablaDetalleIngreso" class="table table-bordered table-striped">
                                                    <thead>
                                                        <tr>
                                                            <th>ID Detalle</th>
                                                            <th>Tipo Prenda / Servicio</th>
                                                            <th>Estado Prenda</th>
                                                            <th>Descuento</th>
                                                            <th>Cantidad</th>
                                                            <th>Valor</th>
                                                            <th>Observación</th>
                                                            <th>Domicilio</th>
                                                            <th>Acción</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="tbodyDetalleIngreso">
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Menú de Opciones -->
                                    <div class="card-body">

                                        <div class="row">
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <button type="button" id="btnAgre" class="btn-block btn-lg btn-primary">Agregar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <button type="button" id="btnModi" class="btn-block btn-lg btn-primary">Modificar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <button type="button" id="btnBusc" class="btn-block btn-lg btn-primary">Buscar</button>
                                                </div>
                                            </div>

                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <button type="button" id="btnCanc" class="btn-block btn-lg btn-primary">Cancelar/Limpiar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <button type="button" id="btnImpr" class="btn-block btn-lg btn-primary">Impresión</button>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- INICIO Sección tabla para detalle(s) (oculta al inicio) -->
                                        <!-- Acá va la Sección de ingresados con la tabla respectiva -->
                                        <!-- FIN Sección tabla detalle(s) -->
                                        <!-- Fin Menú de Opciones-->

                                    </div>
                                </div><!-- card card-gray-dark -->
                                <!-- Acá rows para la tabla Principal-->
                                <div class="row">
                                    <div class="col-md-12">
                                        <table id="tablaDatos" class="table table-bordered table-striped">
                                            <thead>
                                                <tr>
                                                    <th></th>
                                                    <th></th>
                                                    <th></th>
                                                </tr>
                                            </thead>
                                        </table>
                                    </div>
                                </div>
                                <!-- Fin row para la tabla -->

                            </div>  <!-- /.card-body -->

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Para los script de uso base (Conservar el orden) -->
    <script src="../Scripts/jquery-3.7.0.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/bootstrap.min.js"></script>

    <!--Para sweetAlert-->
    <script src="../Scripts_Form/Comunes/sweetalert2.all.min.js"></script>

    <!-- Select2 -->
    <script src="../Scripts/select2.min.js"></script>
    <script src="../Scripts_Form/Comunes/Combos.js"></script>
    <script src="../Scripts_Form/Comunes/Tablas.js"></script>
    <!--Librerías comunes de JavaScript para las Tablas -->
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <!-- Impresión -->
    <!-- Para el script de control del form -->
    <script src="../Scripts_Form/frmIngreso.js"></script>
</body>
</html>
